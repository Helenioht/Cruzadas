<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cruzadas de Helenio</title>
    
    <!-- Ícone SVG Dourado Integrado -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><defs><linearGradient id='bg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%231e293b'/><stop offset='100%25' stop-color='%230f172a'/></linearGradient><linearGradient id='gold' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%23bf953f'/><stop offset='25%25' stop-color='%23fcf6ba'/><stop offset='50%25' stop-color='%23b38728'/><stop offset='75%25' stop-color='%23fbf5b7'/><stop offset='100%25' stop-color='%23aa771c'/></linearGradient></defs><rect width='512' height='512' rx='108' fill='url(%23bg)' stroke='url(%23gold)' stroke-width='10'/ stroke-opacity='0.5'/><g transform='translate(96, 96)'><rect x='0' y='0' width='90' height='90' rx='16' fill='%230f172a' stroke='url(%23gold)' stroke-width='6'/><text x='45' y='64' font-family='sans-serif' font-weight='900' font-size='56' fill='url(%23gold)' text-anchor='middle'>H</text><rect x='110' y='0' width='90' height='90' rx='16' fill='url(%23gold)'/><rect x='220' y='0' width='90' height='90' rx='16' fill='%230f172a' stroke='url(%23gold)' stroke-width='6'/><text x='265' y='64' font-family='sans-serif' font-weight='900' font-size='56' fill='url(%23gold)' text-anchor='middle'>C</text><rect x='0' y='110' width='90' height='90' rx='16' fill='url(%23gold)'/><text x='45' y='174' font-family='sans-serif' font-weight='900' font-size='56' fill='%230f172a' text-anchor='middle'>Z</text><rect x='110' y='110' width='90' height='90' rx='16' fill='%230f172a' stroke='url(%23gold)' stroke-width='6'/><rect x='220' y='110' width='90' height='90' rx='16' fill='%230f172a' stroke='url(%23gold)' stroke-width='6'/><rect x='0' y='220' width='90' height='90' rx='16' fill='%230f172a' stroke='url(%23gold)' stroke-width='6'/><path d='M 230 230 L 310 150 L 330 170 L 250 250 Z' fill='url(%23gold)'/><path d='M 230 230 L 220 260 L 250 250 Z' fill='%23fcf6ba'/></g></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a url('https://i.ibb.co/N245pV0g/1000046888.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
        }

        .gold-text {
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.8));
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.80);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
        }

        .cw-cell {
            width: 38px;
            height: 38px;
            position: relative;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            transition: all 0.15s ease;
        }

        .cw-cell input {
            width: 100%;
            height: 100%;
            text-align: center;
            background: transparent;
            border: none;
            outline: none;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #0f172a;
            cursor: pointer;
        }

        .cw-cell.cell-block {
            background-color: #0f172a;
            border-color: #1e293b;
        }

        .cw-cell.cell-word {
            background-color: #fef08a;
        }

        .cw-cell.cell-active {
            background-color: #2563eb !important;
        }

        .cw-cell.cell-active input {
            color: #ffffff !important;
        }

        .cw-cell .cell-num {
            position: absolute;
            top: 2px;
            left: 3px;
            font-size: 0.6rem;
            font-weight: 700;
            color: #475569;
            line-height: 1;
            pointer-events: none;
            z-index: 5;
        }

        .cw-cell.cell-active .cell-num {
            color: #ffffff;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-3px); }
            75% { transform: translateX(3px); }
        }

        .cw-cell.cell-error {
            background-color: #fecdd3 !important;
            animation: shake 0.25s ease-in-out;
        }

        .cw-cell.cell-error input {
            color: #e11d48 !important;
        }

        .cw-cell.word-complete {
            background-color: #dcfce7 !important;
        }

        .cw-cell.word-complete input {
            color: #15803d !important;
        }

        .clue-item {
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }

        .clue-item.active-clue {
            background-color: #eff6ff;
            border-left-color: #2563eb;
            color: #1e40af;
            font-weight: 600;
        }

        .clue-item.completed-clue {
            opacity: 0.5;
            text-decoration: line-through;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.5);
            border-radius: 4px;
        }
    </style>
</head>
<body class="p-3 md:p-5 text-slate-800">

    <!-- Cabeçalho -->
    <header class="max-w-7xl mx-auto flex items-center justify-center gap-3 mb-4">
        <svg class="w-8 h-8 md:w-9 h-9 drop-shadow-md flex-shrink-0" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#1e293b"/>

                </linearGradient>
                <linearGradient id="headerGold" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#bf953f"/>
                    <stop offset="25%" stop-color="#fcf6ba"/>

            </defs>
            <rect width="512" height="512" rx="108" fill="url(#headerBg)" stroke="url(#headerGold)" stroke-width="12" stroke-opacity="0.6"/>
            <g transform="translate(96, 96)">
                <rect x="0" y="0" width="90" height="90" rx="16" fill="#0f172a" stroke="url(#headerGold)" stroke-width="6"/>
                <text x="45" y="64" font-family="sans-serif" font-weight="900" font-size="56" fill="url(#headerGold)" text-anchor="middle">H</text>
                <rect x="110" y="0" width="90" height="90" rx="16" fill="url(#headerGold)"/>
                <rect x="220" y="0" width="90" height="90" rx="16" fill="#0f172a" stroke="url(#headerGold)" stroke-width="6"/>
                <text x="265" y="64" font-family="sans-serif" font-weight="900" font-size="56" fill="url(#headerGold)" text-anchor="middle">C</text>
                <rect x="0" y="110" width="90" height="90" rx="16" fill="url(#headerGold)"/>
                <text x="45" y="174" font-family="sans-serif" font-weight="900" font-size="56" fill="#0f172a" text-anchor="middle">Z</text>
                <rect x="110" y="110" width="90" height="90" rx="16" fill="#0f172a" stroke="url(#headerGold)" stroke-width="6"/>
                <rect x="220" y="110" width="90" height="90" rx="16" fill="#0f172a" stroke="url(#headerGold)" stroke-width="6"/>
                <rect x="0" y="220" width="90" height="90" rx="16" fill="#0f172a" stroke="url(#headerGold)" stroke-width="6"/>
                <path d="M 230 230 L 310 150 L 330 170 L 250 250 Z" fill="url(#headerGold)"/>
                <path d="M 230 230 L 220 260 L 250 250 Z" fill="#fcf6ba"/>
            </g>
        </svg>
        <h1 class="text-xl md:text-2xl font-black tracking-wider uppercase gold-text">Cruzadas de Helenio</h1>
    </header>

    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-5">
        
        <!-- Painel Lateral -->
        <section class="lg:col-span-4 glass-panel rounded-2xl p-4 text-white shadow-2xl flex flex-col justify-between">
            <div>
                <div class="flex items-center justify-between border-b border-white/10 pb-3 mb-4">
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        <h2 class="text-sm font-bold tracking-wide uppercase text-slate-200">Painel de Jogos</h2>
                    </div>
                    <button id="exitBtn" class="bg-red-600/80 hover:bg-red-600 text-white text-xs font-semibold px-2.5 py-1 rounded-lg transition duration-200 shadow">🚪 Sair</button>
                </div>

                <div class="space-y-3">
                    <div>
                        <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-300 mb-1">Dimensão da Grade</label>
                        <select id="gridSize" class="w-full bg-slate-800/90 border border-slate-600 rounded-lg p-2 text-xs text-white focus:ring-2 focus:ring-amber-500 outline-none">
                            <option value="10">10 × 10 (Pequena)</option>

                    </div>

                    <div>
                        <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-300 mb-1">Origem das Palavras</label>
                        <select id="wordSource" class="w-full bg-slate-800/90 border border-slate-600 rounded-lg p-2 text-xs text-white focus:ring-2 focus:ring-amber-500 outline-none">
                            <option value="random">🔀 Aleatório do Banco</option>
                            <option value="default">📚 Banco Padrão</option>

                        </select>
                    </div>

                    <!-- Opções para Aleatório -->
                    <div id="randomOptions" class="space-y-2">

            <div class="space-y-2 mt-5 pt-3 border-t border-white/10">

                    <span>🧩</span> Gerar Nova Cruzada

                <div class="grid grid-cols-2 gap-2">
                    <button id="checkBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 px-3 rounded-xl text-xs transition duration-200 flex items-center justify-center gap-1 shadow">

        </section>

        <!-- Área Principal -->
        <section class="lg:col-span-8 glass-card rounded-2xl p-4 md:p-5 shadow-2xl flex flex-col justify-between">
            <div class="flex-1 flex flex-col items-center justify-center">
                <div id="crosswordContainer" class="p-2 bg-slate-900/5 rounded-xl border border-slate-200/80 overflow-x-auto max-w-full">
                    <p class="text-slate-500 font-medium my-12 text-center text-sm">Clique em "Gerar Nova Cruzada" para iniciar.</p>

            <!-- Dicas -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4 pt-3 border-t border-slate-200">

    <!-- Modal Vitória -->
    <div id="winModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 text-center shadow-2xl border border-amber-300">

            <button id="modalCloseBtn" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl shadow transition duration-200">Jogar Novamente</button>

    <footer class="max-w-7xl mx-auto text-center mt-6 text-white/70 text-xs font-medium drop-shadow">
        <p>✦ Cruzadas de Helenio © 2026 ✦</p>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            if (type === 'wordSuccess') {
                osc.type='triangle'; osc.frequency.setValueAtTime(523.25,now); osc.frequency.setValueAtTime(659.25,now+.1); osc.frequency.setValueAtTime(783.99,now+.2);
                gain.gain.setValueAtTime(.15,now); gain.gain.exponentialRampToValueAtTime(.01,now+.4); osc.start(now); osc.stop(now+.4);
            } else if (type === 'error') {
                osc.type='sawtooth'; osc.frequency.setValueAtTime(150,now); osc.frequency.linearRampToValueAtTime(100,now+.15);
                gain.gain.setValueAtTime(.1,now); gain.gain.exponentialRampToValueAtTime(.01,now+.15); osc.start(now); osc.stop(now+.15);
            } else if (type === 'gameWin') {
                [523.25,659.25,783.99,1046.5].forEach((f,i)=>{
                    const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.type='sine';
                    o.frequency.value=f; g.gain.setValueAtTime(.15,now+i*.12); g.gain.exponentialRampToValueAtTime(.01,now+i*.12+.3);
                    o.start(now+i*.12); o.stop(now+i*.12+.3);
                });
            }
        }

        const defaultWords = [
            {word:"AMOR",clue:"Sentimento de afeto"},{word:"CASA",clue:"Lugar de morar"},{word:"SOL",clue:"Estrela do sistema"},
            {word:"MAR",clue:"Massa de água salgada"},{word:"FOGO",clue:"Combustão com calor"},{word:"ARVORE",clue:"Planta com tronco"},
            {word:"LIVRO",clue:"Volume com textos"},{word:"CIDADE",clue:"Centro urbano"},{word:"GATO",clue:"Felino doméstico"},
            {word:"CAVALO",clue:"Equino de montaria"},{word:"ESCOLA",clue:"Local de ensino"},{word:"FAMILIA",clue:"Parentesco"},
            {word:"NOITE",clue:"Período escuro"},{word:"AGUA",clue:"Essencial à vida"},{word:"TERRA",clue:"Nosso planeta"},
            {word:"FLOR",clue:"Parte da planta"},{word:"PAZ",clue:"Ausência de conflito"},{word:"VIDA",clue:"Existência"},
            {word:"CÉU",clue:"Espaço celeste"},{word:"LUZ",clue:"Permite enxergar"},{word:"PONTE",clue:"Liga caminhos"},
            {word:"RIO",clue:"Água corrente"},{word:"PEDRA",clue:"Material duro"},{word:"OURO",clue:"Metal precioso"},
            {word:"FLORESTA",clue:"Área com árvores"},{word:"MONTANHA",clue:"Elevação do terreno"},{word:"ESTRELA",clue:"Corpo celeste"}
        ];

        let grid = [], placedWords = [], gridSize = 12, activeDirection = 'horizontal', activeCell = {r:-1,c:-1}, completedWordsSet = new Set();

        const wordSourceSelect = document.getElementById('wordSource');
        const customWordsArea = document.getElementById('customWordsArea');
        const randomOptions = document.getElementById('randomOptions');
        const customWordsTextarea = document.getElementById('customWords');
        const gridSizeSelect = document.getElementById('gridSize');
        const wordCountInput = document.getElementById('wordCount');
        const minLengthInput = document.getElementById('minLength');
        const maxLengthInput = document.getElementById('maxLength');
        const generateBtn = document.getElementById('generateBtn');
        const checkBtn = document.getElementById('checkBtn');
        const clearBtn = document.getElementById('clearBtn');
        const exitBtn = document.getElementById('exitBtn');
        const crosswordContainer = document.getElementById('crosswordContainer');
        const cluesHorizontalEl = document.getElementById('cluesHorizontal');
        const cluesVerticalEl = document.getElementById('cluesVertical');
        const winModal = document.getElementById('winModal');
        const modalCloseBtn = document.getElementById('modalCloseBtn');

        wordSourceSelect.addEventListener('change', () => {
            const s = wordSourceSelect.value;
            customWordsArea.classList.toggle('hidden', s !== 'custom');
            randomOptions.classList.toggle('hidden', s !== 'random');
        });

        function parseCustomWords(t) {
            return t.trim().split('\n').map(l=>{
                const p=l.split(':');
                if(p.length>=2){
                    const w=p[0].trim().toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Z]/g,"");
                    const d=p.slice(1).join(':').trim();
                    if(w.length>=2) return {word:w, clue:d};
                }
                return null;
            }).filter(Boolean);
        }

        function getRandomWordBank() {
            const q=+wordCountInput.value, min=+minLengthInput.value, max=+maxLengthInput.value;
            let f = defaultWords.filter(x=>x.word.length>=min && x.word.length<=max);
            for(let i=f.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[f[i],f[j]]=[f[j],f[i]];}
            return f.slice(0,Math.min(q,f.length));
        }

        function initGrid() { grid=Array(gridSize).fill(null).map(()=>Array(gridSize).fill(null)); placedWords=[]; completedWordsSet.clear(); }

        function canPlaceWord(w, r, c, dir) {
            const len=w.length;
            if(dir==='horizontal'){
                if(c+len>gridSize) return false;
                if(c>0 && grid[r][c-1]) return false;
                if(c+len<gridSize && grid[r][c+len]) return false;
                let x=0;
                for(let i=0;i<len;i++){
                    const cel=grid[r][c+i];
                    if(cel){if(cel.letter!==w[i]) return false; x++;}
                    else {if(r>0 && grid[r-1][c+i]) return false; if(r<gridSize-1 && grid[r+1][c+i]) return false;}
                }
                return x>0 || placedWords.length===0;
            } else {
                if(r+len>gridSize) return false;
                if(r>0 && grid[r-1][c]) return false;
                if(r+len<gridSize && grid[r+len][c]) return false;
                let x=0;
                for(let i=0;i<len;i++){
                    const cel=grid[r+i][c];
                    if(cel){if(cel.letter!==w[i]) return false; x++;}
                    else {if(c>0 && grid[r+i][c-1]) return false; if(c<gridSize-1 && grid[r+i][c+1]) return false;}
                }
                return x>0 || placedWords.length===0;
            }
        }

        function placeWord(obj, r, c, dir, num) {
            const w=obj.word;
            for(let i=0;i<w.length;i++){
                const nr=dir==='horizontal'?r:r+i, nc=dir==='horizontal'?c+i:c;
                if(!grid[nr][nc]) grid[nr][nc]={letter:w[i], number:null};
            }
            if(!grid[r][c].number) grid[r][c].number=num; else num=grid[r][c].number;
            placedWords.push({...obj, row:r, col:c, direction:dir, number:num, id:`${dir}-${r}-${c}`});
        }

        function fillGrid(list) {
            initGrid();
            const sorted=[...list].sort((a,b)=>b.word.length-a.word.length);
            let seq=1;
            if(!sorted.length) return;
            const first=sorted.shift(), sr=Math.floor(gridSize/2), sc=Math.max(0,Math.floor((gridSize-first.word.length)/2));
            placeWord(first,sr,sc,'horizontal',seq++);
            for(const obj of sorted){
                let ok=false;
                for(let r=0;r<gridSize && !ok;r++){
                    for(let c=0;c<gridSize && !ok;c++){
                        for(const dir of ['horizontal','vertical']){
                            if(canPlaceWord(obj.word,r,c,dir)){ placeWord(obj,r,c,dir,seq++); ok=true; break; }
                        }
                    }
                }
            }
        }

        function renderGrid() {
            crosswordContainer.innerHTML=''; cluesHorizontalEl.innerHTML=''; cluesVerticalEl.innerHTML='';
            const tab=document.createElement('table'); tab.className='border-collapse shadow-sm rounded-lg overflow-hidden';
            for(let r=0;r<gridSize;r++){
                const tr=document.createElement('tr');
                for(let c=0;c<gridSize;c++){
                    const cel=grid[r][c];
                    const td=document.createElement('td');
                    if(cel){
                        td.className='cw-cell'; td.dataset.row=r; td.dataset.col=c;
                        if(cel.number){const s=document.createElement('span'); s.className='cell-num'; s.textContent=cel.number; td.appendChild(s);}
                        const inp=document.createElement('input'); inp.type='text'; inp.maxLength=1; inp.autocomplete='off'; inp.dataset.row=r; inp.dataset.col=c;
                        inp.addEventListener('click',()=>{if(activeCell.r===r && activeCell.c===c) activeDirection=activeDirection==='horizontal'?'vertical':'horizontal'; setActiveCell(r,c);});
                        inp.addEventListener('input',handleInput); inp.addEventListener('keydown',handleKeyDown);
                        td.appendChild(inp);
                    } else td.className='cw-cell cell-block';
                    tr.appendChild(td);
                }
                tab.appendChild(tr);
            }
            crosswordContainer.appendChild(tab); renderClues();
        }

        function renderClues() {
            const h=placedWords.filter(w=>w.direction==='horizontal').sort((a,b)=>a.number-b.number);
            const v=placedWords.filter(w=>w.direction==='vertical').sort((a,b)=>a.number-b.number);
            h.forEach(w=>{
                const li=document.createElement('li'); li.className='clue-item p-1.5 rounded cursor-pointer hover:bg-slate-100 text-slate-700 leading-tight';
                li.innerHTML=`<span class="font-bold text-amber-700">${w.number}.</span> ${w.clue}`; li.dataset.id=w.id; li.addEventListener('click',()=>focusWord(w));
                cluesHorizontalEl.appendChild(li);
            });
            v.forEach(w=>{
                const li=document.createElement('li'); li.className='clue-item p-1.5 rounded cursor-pointer hover:bg-slate-100 text-slate-700 leading-tight';
                li.innerHTML=`<span class="font-bold text-amber-700">${w.number}.</span> ${w.clue}`; li.dataset.id=w.id; li.addEventListener('click',()=>focusWord(w));
                cluesVerticalEl.appendChild(li);
            });
        }

        function focusWord(w) { activeDirection=w.direction; setActiveCell(w.row,w.col); const i=getCellInput(w.row,w.col); if(i)i.focus(); }
        function setActiveCell(r,c) {
            activeCell={r,c};
            document.querySelectorAll('.cw-cell').forEach(x=>x.classList.remove('cell-active','cell-word'));
            document.querySelectorAll('.clue-item').forEach(x=>x.classList.remove('active-clue'));
            const inp=getCellInput(r,c); if(!inp) return;
            let word=placedWords.find(x=>x.direction===activeDirection && isCellInWord(x,r,c));
            if(!word){ word=placedWords.find(x=>isCellInWord(x,r,c)); if(word) activeDirection=word.direction; }
            if(word){
                for(let i=0;i<word.word.length;i++){
                    const wr=word.direction==='horizontal'?word.row:word.row+i, wc=word.direction==='horizontal'?word.col+i:word.col;
                    const td=document.querySelector(`td[data-row="${wr}"][data-col="${wc}"]`); if(td) td.classList.add('cell-word');
                }
                const clue=document.querySelector(`.clue-item[data-id="${word.id}"]`);
                if(clue){ clue.classList.add('active-clue'); clue.scrollIntoView({block:'nearest',behavior:'smooth'}); }
            }
            const atd=inp.parentElement; if(atd) atd.classList.add('cell-active');
        }
        function isCellInWord(w,r,c) { return w.direction==='horizontal'?(w.row===r && c>=w.col && c<w.col+w.word.length):(w.col===c && r>=w.row && r<w.row+w.word.length); }
        function getCellInput(r,c) { if(r<0||c<0||r>=gridSize||c>=gridSize) return null; return document.querySelector(`input[data-row="${r}"][data-col="${c}"]`); }

        function handleInput(e) {
            const inp=e.target, r=parseInt(inp.dataset.row), c=parseInt(inp.dataset.col), td=inp.parentElement;
            inp.value=inp.value.toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Z]/g,"");
            const val=inp.value; td.classList.remove('cell-error');
            if(val){
                if(val!==grid[r][c].letter){ td.classList.add('cell-error'); playSound('error'); }
                checkWordCompletions();
                const next=activeDirection==='horizontal'?getCellInput(r,c+1):getCellInput(r+1,c);
                if(next){ setActiveCell(parseInt(next.dataset.row),parseInt(next.dataset.col)); next.focus(); }
            }
        }

        function checkWordCompletions() {
            let newDone=false;
            placedWords.forEach(w=>{
                if(completedWordsSet.has(w.id)) return;
                let ok=true;
                for(let i=0;i<w.word.length;i++){
                    const wr=w.direction==='horizontal'?w.row:w.row+i, wc=w.direction==='horizontal'?w.col+i:w.col;
                    const inp=getCellInput(wr,wc); if(!inp || inp.value.toUpperCase()!==w.word[i]){ ok=false; break; }
                }
                if(ok){
                    completedWordsSet.add(w.id); newDone=true;
                    for(let i=0;i<w.word.length;i++){
                        const wr=w.direction==='horizontal'?w.row:w.row+i, wc=w.direction==='horizontal'?w.col+i:w.col;
                        getCellInput(wr,wc).parentElement.classList.add('word-complete');
                    }
                    const clue=document.querySelector(`.clue-item[data-id="${w.id}"]`); if(clue) clue.classList.add('completed-clue');
                }
            });
            if(newDone){
                if(completedWordsSet.size===placedWords.length){ playSound('gameWin'); winModal.classList.remove('hidden'); }
                else playSound('wordSuccess');
            }
        }

        function handleKeyDown(e) {
            const inp=e.target, r=parseInt(inp.dataset.row), c=parseInt(inp.dataset.col);
            if(e.key===' '){ e.preventDefault(); activeDirection=activeDirection==='horizontal'?'vertical':'horizontal'; setActiveCell(r,c); return; }
            let next=null;
            if(e.key==='ArrowRight') next=getCellInput(r,c+1);
            if(e.key==='ArrowLeft') next=getCellInput(r,c-1);
            if(e.key==='ArrowDown') next=getCellInput(r+1,c);
            if(e.key==='ArrowUp') next=getCellInput(r-1,c);
            if(e.key==='Backspace' && !inp.value){
                const prev=activeDirection==='horizontal'?getCellInput(r,c-1):getCellInput(r-1,c);
                if(prev){ e.preventDefault(); prev.value=''; prev.parentElement.classList.remove('cell-error'); setActiveCell(+prev.dataset.row,+prev.dataset.col); prev.focus(); }
            }
            if(next){ e.preventDefault(); setActiveCell(+next.dataset.row,+next.dataset.col); next.focus(); }
        }

        function checkAnswers() {
            let cor=0, total=0;
            for(let r=0;r<gridSize;r++) for(let c=0;c<gridSize;c++){
                if(grid[r][c]){
                    total++; const inp=getCellInput(r,c), td=inp?inp.parentElement:null; if(!inp||!td) continue;
                    td.classList.remove('cell-error'); const v=inp.value.toUpperCase();
                    if(v===grid[r][c].letter) cor++; else if(v) td.classList.add('cell-error');
                }
            }
            alert(`Verificação:\nAcertos: ${cor} de ${total} letras.`);
        }

        function clearGrid() {
            document.querySelectorAll('.cw-cell').forEach(x=>{x.classList.remove('cell-error','word-complete'); const i=x.querySelector('input'); if(i)i.value='';});
            document.querySelectorAll('.clue-item').forEach(x=>x.classList.remove('completed-clue')); completedWordsSet.clear();
        }

        function exitGame() {
            crosswordContainer.innerHTML='<p class="text-slate-500 font-medium my-12 text-center text-sm">Jogo encerrado.</p>';
            cluesHorizontalEl.innerHTML=''; cluesVerticalEl.innerHTML=''; grid=[]; placedWords=[]; completedWordsSet.clear();
        }

        generateBtn.addEventListener('click', () => {
            gridSize=+gridSizeSelect.value; let list=[]; const src=wordSourceSelect.value;
            if(src==='random') list=getRandomWordBank();
            else if(src==='default') list=[...defaultWords];
            else if(src==='custom'){ list=parseCustomWords(customWordsTextarea.value); if(list.length<2){alert('Insira pelo menos 2 palavras válidas!');return;} }
            fillGrid(list); renderGrid();
        });

        checkBtn.addEventListener('click',checkAnswers); clearBtn.addEventListener('click',clearGrid); exitBtn.addEventListener('click',exitGame);
        modalCloseBtn.addEventListener('click',()=>{winModal.classList.add('hidden'); generateBtn.click();});
    </script>
</body>
</html>
